services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo-intelligence-api
    # Host networking lets this process call the Cursor bridge on 127.0.0.1.
    # The login stays on the host. Store ports are the published host ports.
    network_mode: host
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5433/repona
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: repo-intelligence-password
      DEBUG: "false"
      LLM_PROVIDER: cursor
      CURSOR_MODEL: ${CURSOR_MODEL:-composer-2.5-fast}
      CURSOR_TIMEOUT: ${CURSOR_TIMEOUT:-180}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_BRIDGE_URL: ${CURSOR_BRIDGE_URL:-http://127.0.0.1:8765}
      CURSOR_BRIDGE_TOKEN: ${CURSOR_BRIDGE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-800}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-60}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_BASE_URL: ${ZAI_BASE_URL:-https://api.z.ai/api/paas/v4}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.3}
      ZAI_TIMEOUT: ${ZAI_TIMEOUT:-60}
      CONTEXT_MARGIN_TOKENS: ${CONTEXT_MARGIN_TOKENS:-256}
      CLAIM_DIAGNOSTICS: ${CLAIM_DIAGNOSTICS:-false}
      CLAIM_DIAGNOSTICS_RAW: ${CLAIM_DIAGNOSTICS_RAW:-false}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-false}
      RATE_LIMIT_ASK_PER_MINUTE: ${RATE_LIMIT_ASK_PER_MINUTE:-12}
      RATE_LIMIT_INDEX_PER_HOUR: ${RATE_LIMIT_INDEX_PER_HOUR:-360}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - app_data:/app/data
      - ./backend:/app/backend:ro
      - ./frontend:/app/frontend:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: repo-intelligence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_intelligence
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d repo_intelligence" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repo-intelligence-network

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: repo-intelligence-qdrant
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - repo-intelligence-network

  neo4j:
    image: neo4j:5-community
    container_name: repo-intelligence-neo4j
    environment:
      NEO4J_AUTH: neo4j/repo-intelligence-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p repo-intelligence-password 'RETURN 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - repo-intelligence-network

volumes:
  app_data:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

networks:
  repo-intelligence-network:
    name: repo-intelligence-network
    driver: bridge
