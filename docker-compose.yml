services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo-intelligence-api
    environment:
      APP_NAME: Repository Intelligence Agent API
      APP_ENV: local
      APP_VERSION: 0.1.0
      API_V1_PREFIX: /api/v1
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/repo_intelligence
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-800}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: repo-intelligence-password
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # ollama:
      #   condition: service_started
    networks:
      - repo-intelligence-network

  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: repo-intelligence-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - repo-intelligence-network

  postgres:
    image: postgres:16-alpine
    container_name: repo-intelligence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d repo_intelligence" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repo-intelligence-network

  neo4j:
    image: neo4j:5-community
    container_name: repo-intelligence-neo4j
    environment:
      NEO4J_AUTH: neo4j/repo-intelligence-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p repo-intelligence-password 'RETURN 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - repo-intelligence-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  ollama_data:

networks:
  repo-intelligence-network:
    driver: bridge
