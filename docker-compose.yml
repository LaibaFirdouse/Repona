services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo-intelligence-api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/repo_intelligence
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: repo-intelligence-password
      LLM_PROVIDER: ${CONTAINER_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - repo-intelligence-network

  postgres:
    image: postgres:16-alpine
    container_name: repo-intelligence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_intelligence
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d repo_intelligence" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repo-intelligence-network

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: repo-intelligence-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - repo-intelligence-network

  neo4j:
    image: neo4j:5-community
    container_name: repo-intelligence-neo4j
    environment:
      NEO4J_AUTH: neo4j/repo-intelligence-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p repo-intelligence-password 'RETURN 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - repo-intelligence-network

volumes:
  app_data:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

networks:
  repo-intelligence-network:
    driver: bridge
