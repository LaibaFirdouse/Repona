services:
  postgres:
    image: postgres:16-alpine
    container_name: repo-intelligence-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repo_intelligence
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d repo_intelligence" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repo-intelligence-network

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: repo-intelligence-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - repo-intelligence-network

  neo4j:
    image: neo4j:5-community
    container_name: repo-intelligence-neo4j
    environment:
      NEO4J_AUTH: neo4j/repo-intelligence-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p repo-intelligence-password 'RETURN 1' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - repo-intelligence-network

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

networks:
  repo-intelligence-network:
    driver: bridge
